<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}水质送检表入仓更正{% endblock %}</title>
  <style>
    :root { --blue:#1a5fb4; --red:#c01c28; --green:#1a7f37; --gray:#6b7280; }
    * { box-sizing: border-box; }
    body { font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
           margin:0; background:#f4f6f9; color:#1f2937; }
    header { background:var(--blue); color:#fff; padding:14px 28px; }
    header a { color:#fff; text-decoration:none; font-size:20px; font-weight:600; }
    main { max-width:1180px; margin:24px auto; padding:0 20px; }
    .card { background:#fff; border-radius:10px; padding:20px 24px;
            box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:22px; }
    h2 { margin-top:0; font-size:18px; border-left:4px solid var(--blue);
         padding-left:10px; }
    table { border-collapse:collapse; width:100%; font-size:13.5px; }
    th, td { border:1px solid #d7dce3; padding:7px 9px; text-align:left; }
    th { background:#eef2f7; white-space:nowrap; }
    tr.batch-head td { background:#e8f0fe; font-weight:600; }
    .muted { color:var(--gray); font-size:12.5px; }
    .tag { display:inline-block; padding:1px 8px; border-radius:10px;
           font-size:12px; white-space:nowrap; }
    .tag-original { background:#e5e7eb; color:#374151; }
    .tag-batch { background:#fef3c7; color:#92400e; }
    .tag-sample { background:#dcfce7; color:#166534; }
    .tag-revoked { background:#fee2e2; color:#991b1b; }
    .flash { padding:11px 16px; border-radius:8px; margin-bottom:14px; font-size:14px; }
    .flash.success { background:#dcfce7; color:var(--green); border:1px solid #86efac; }
    .flash.error { background:#fee2e2; color:var(--red); border:1px solid #fca5a5; }
    form.inline { display:inline; }
    input[type=text] { padding:6px 9px; border:1px solid #c3cad3; border-radius:6px;
                       font-size:13.5px; }
    button, .btn { padding:7px 16px; border:0; border-radius:6px; cursor:pointer;
                   font-size:13.5px; background:var(--blue); color:#fff; }
    button.green { background:var(--green); }
    button.gray { background:#6b7280; }
    button.red { background:var(--red); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .upload-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .file-name { font-weight:600; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
    @media (max-width:900px){ .grid2 { grid-template-columns:1fr; } }
    .nowrap { white-space:nowrap; }
    code { background:#f1f3f5; padding:1px 5px; border-radius:4px; }
    .strike { text-decoration:line-through; color:var(--gray); }
  </style>
</head>
<body>
  <header><a href="{{ url_for('index') }}">水质送检表 · 入仓更正平台</a></header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
